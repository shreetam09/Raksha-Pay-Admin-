name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main
      - features/ML
      - features/backend
      - features/frontend

permissions:
  contents: read

jobs:

  # ============================================================
  # ML
  #
  # Runs on:
  #   - features/ML
  #   - PR: features/ML -> main
  #   - main
  # ============================================================

  ml-tests:
    name: ML Tests
    runs-on: ubuntu-latest

    if: |
      github.ref_name == 'main' ||
      github.ref_name == 'features/ML' ||
      github.head_ref == 'features/ML'

    defaults:
      run:
        working-directory: ml

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ML tests
        run: |
          pytest -v


  # ============================================================
  # BACKEND
  #
  # Runs on:
  #   - features/backend
  #   - PR: features/backend -> main
  #   - main
  #
  # Supports:
  #   - FastAPI / Python
  #   - Node.js
  # ============================================================

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    if: |
      github.ref_name == 'main' ||
      github.ref_name == 'features/backend' ||
      github.head_ref == 'features/backend'

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # Python / FastAPI
      # ----------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        working-directory: backend
        run: |
          if [ -f requirements.txt ]; then
            python -m pip install --upgrade pip
            pip install -r requirements.txt
          else
            echo "No backend/requirements.txt found."
            echo "Skipping Python dependency installation."
          fi

      - name: Run FastAPI / Python tests
        working-directory: backend
        run: |
          if [ -f requirements.txt ] && [ -d tests ]; then
            pytest -v
          elif [ -f requirements.txt ]; then
            echo "No backend/tests directory found."
            echo "Skipping Python tests."
          else
            echo "No Python backend detected."
            echo "Skipping Python tests."
          fi


      # ----------------------------------------------------------
      # Node.js
      # ----------------------------------------------------------

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Node dependencies
        working-directory: backend
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          else
            echo "No package.json found."
            echo "Skipping Node dependency installation."
          fi

      - name: Run Node tests
        working-directory: backend
        run: |
          if [ -f package.json ]; then
            npm test --if-present
          else
            echo "No package.json found."
            echo "Skipping Node tests."
          fi


  # ============================================================
  # FRONTEND
  #
  # Runs on:
  #   - features/frontend
  #   - PR: features/frontend -> main
  #   - main
  #
  # React / Node.js
  # ============================================================

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest

    if: |
      github.ref_name == 'main' ||
      github.ref_name == 'features/frontend' ||
      github.head_ref == 'features/frontend'

    defaults:
      run:
        working-directory: frontend

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          else
            echo "No package.json found."
            exit 1
          fi

      - name: Run lint
        run: |
          npm run lint --if-present

      - name: Run tests
        run: |
          npm test --if-present

      - name: Build frontend
        run: |
          npm run build


  # ============================================================
  # CI SUMMARY
  #
  # Runs after all applicable jobs finish.
  #
  # Important:
  #   "skipped" is valid because only the relevant stack runs
  #   on feature branches / PRs.
  #
  # Any actual failure causes the summary to fail.
  # ============================================================

  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest

    needs:
      - ml-tests
      - backend-tests
      - frontend-tests

    if: always()

    steps:

      - name: Display results
        run: |
          echo "======================================"
          echo "           CI RESULTS"
          echo "======================================"

          echo "ML:       ${{ needs.ml-tests.result }}"
          echo "Backend:  ${{ needs.backend-tests.result }}"
          echo "Frontend: ${{ needs.frontend-tests.result }}"

          echo "======================================"


      - name: Validate results
        run: |
          ML="${{ needs.ml-tests.result }}"
          BACKEND="${{ needs.backend-tests.result }}"
          FRONTEND="${{ needs.frontend-tests.result }}"

          if [[ "$ML" == "failure" ||
                "$BACKEND" == "failure" ||
                "$FRONTEND" == "failure" ]]; then

            echo "❌ One or more CI jobs failed."
            exit 1
          fi

          if [[ "$ML" == "cancelled" ||
                "$BACKEND" == "cancelled" ||
                "$FRONTEND" == "cancelled" ]]; then

            echo "❌ One or more CI jobs were cancelled."
            exit 1
          fi

          echo "✅ All applicable CI jobs passed."
